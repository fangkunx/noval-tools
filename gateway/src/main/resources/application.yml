server:
  port: 8082

spring:
  application:
    name: gateway
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:h2:file:./data/gateway-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Gateway provider configuration
gateway:
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
    claude:
      api-key: ${CLAUDE_API_KEY:}
      base-url: https://api.anthropic.com
    google:
      api-key: ${GOOGLE_API_KEY:}
      base-url: https://generativelanguage.googleapis.com
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
    grsai:
      api-key: ${GRSAI_API_KEY:}
      base-url: https://grsaiapi.com
    kl-chat:
      api-key: ${KL_CHAT_API_KEY:}
      base-url: https://apikl.ai
    kl-image:
      api-key: ${KL_IMAGE_API_KEY:}
      base-url: https://apikl.ai
    lk888:
      api-key: ${LK888_API_KEY:sk-}
      base-url: https://api.lk888.ai
  # Qiniu Cloud OSS configuration
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    domain: ${QINIU_DOMAIN:http://toj7jniwd.hn-bkt.clouddn.com}
  logging:
    request-body: true
    response-body: true

# LangSmith tracing configuration
langsmith:
  enabled: false  # 设置为 true 启用 LangSmith trace 上报
  api-key: ${LANGSMITH_API_KEY:}  # 你的 LangSMITH API Key
  endpoint: https://api.smith.langchain.com
  project-name: ai-gateway

logging:
  level:
    com.noval.gateway: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{spanId}] %-5level %logger{36} - %msg%n"

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
